<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>双耳节拍听感调研</title><style>
:root{color-scheme:dark;font:16px/1.55 system-ui,sans-serif;background:#10181c;color:#f2f5f2}
*{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:auto;padding:clamp(28px,8vw,70px) 20px}
h1{font-size:clamp(30px,7vw,48px);line-height:1.16;margin:0 0 16px}p{color:#bdceca}
.track{display:grid;grid-template-columns:85px 1fr;align-items:center;gap:8px;border-bottom:1px solid #344542;padding:9px 0}
audio{width:100%;height:43px}fieldset{padding:0;border:0;margin:26px 0 14px}legend{font-weight:700;padding:0;margin-bottom:9px}
label{display:inline-flex;gap:6px;align-items:center;padding:9px;margin:3px 6px 3px 0;background:#233431;border-radius:7px}
label:has(:checked){outline:2px solid #9ce9c9}button{background:#a8f0cf;color:#122920;border:0;border-radius:8px;padding:11px 20px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.55}
a{color:#a8f0cf}footer{margin-top:32px}#unlock input{display:block;margin:8px 0 14px;padding:10px;font:inherit;border:1px solid #637774;border-radius:7px;width:100%;max-width:240px}
meter{width:100%;display:block;height:22px}#status{min-height:1.6em}
</style><main><h1>音乐听感调研</h1><p>请将音量调到舒适水平。听完五段各 5 秒的音频后，选出你最喜欢的一段。可以重复试听。</p><div class="track"><strong>样本 A</strong><audio aria-label="样本 A" controls preload="none" src="audio/A.mp3"></audio></div><div class="track"><strong>样本 B</strong><audio aria-label="样本 B" controls preload="none" src="audio/B.mp3"></audio></div><div class="track"><strong>样本 C</strong><audio aria-label="样本 C" controls preload="none" src="audio/C.mp3"></audio></div><div class="track"><strong>样本 D</strong><audio aria-label="样本 D" controls preload="none" src="audio/D.mp3"></audio></div><div class="track"><strong>样本 E</strong><audio aria-label="样本 E" controls preload="none" src="audio/E.mp3"></audio></div><form><fieldset><legend>只考虑听感，你最喜欢哪一段？</legend><label><input required name="choice" type="radio" value="A">样本 A</label><label><input required name="choice" type="radio" value="B">样本 B</label><label><input required name="choice" type="radio" value="C">样本 C</label><label><input required name="choice" type="radio" value="D">样本 D</label><label><input required name="choice" type="radio" value="E">样本 E</label></fieldset><button>提交选择</button></form><p id="status" role="status"></p><footer><a href="/binaural-vote/results.html">我是实验人员</a></footer></main><script>
const form = document.querySelector('form');
const status = document.querySelector('#status');
const button = form.querySelector('button');
const tracks = [...document.querySelectorAll('audio')];
for (const track of tracks) track.addEventListener('play', () => {
  for (const other of tracks) if (other !== track) other.pause();
});

let id = crypto.randomUUID();

function finished() {
  form.hidden = true;
  status.textContent = '感谢参与，你的选择已记录。刷新页面可再次填写。';
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  button.disabled = true;
  status.textContent = '正在提交…';
  try {
    const choice = new FormData(form).get('choice');
    
const BIN_ID = '6af57949ffd5d16053bb6e81';
const ACCESS_KEY = '$2a$10$CeleCPa5DaDMY86Eqdn4V.REyg0XstepJYRNgtgIW9xjppXw8gT4u';
const BIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

const readResponse = await fetch(BIN_URL + '/latest', {
  headers: { 'X-Access-Key': ACCESS_KEY },
  cache: 'no-store'
});
if (!readResponse.ok) throw Error('读取失败');

const data = (await readResponse.json()).record;
if (!Array.isArray(data.votes)) throw Error('数据格式错误');

if (!data.votes.some(vote => vote.id === id)) {
  data.votes.push({
    id,
    choice,
    time: new Date().toISOString()
  });

  const writeResponse = await fetch(BIN_URL, {
    method: 'PUT',
    headers: {
      'Content-Type': 'application/json',
      'X-Access-Key': ACCESS_KEY
    },
    body: JSON.stringify(data)
  });
  if (!writeResponse.ok) throw Error('保存失败');
}

    finished();
  } catch {
    status.textContent = '提交失败，请重试。';
    button.disabled = false;
  }
});
</script></html>
